name: Android CI

on:
  push:
    branches:
      - "claude/**"
      - "codex/**"
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Validate and build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android scaffold and plugin compileSdk compatibility
        run: |
          flutter create --platforms=android --org com.qingji --project-name qingji /tmp/scaffold
          if [ ! -d android-app/android ]; then
            cp -r /tmp/scaffold/android android-app/android
          fi
          [ -f android-app/.metadata ] || cp /tmp/scaffold/.metadata android-app/.metadata

          MANIFEST=android-app/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"

          # The app pins compileSdk in build.gradle.kts. This init script only
          # raises Flutter plugin subprojects that still declare an older SDK.
          mkdir -p "$HOME/.gradle/init.d"
          cp android-app/ci/compileSdk36.init.gradle "$HOME/.gradle/init.d/compileSdk36.gradle"

      - name: Resolve dependencies
        working-directory: android-app
        run: flutter pub get

      - name: Validate release tooling
        working-directory: android-app
        run: |
          bash -n ci/publish_update.sh
          bash -n ci/verify_release_apk.sh
          node --test ci/release_gate.test.mjs ci/retention_policy.test.mjs

      - name: Generate launcher icons
        working-directory: android-app
        run: |
          dart run flutter_launcher_icons
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Analyze
        working-directory: android-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: android-app
        run: |
          sudo apt-get install -y libsqlite3-dev \
            || (sudo apt-get update && sudo apt-get install -y libsqlite3-dev)
          flutter test

      - name: Configure fixed release signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/feimiao-p0-fixes'
        working-directory: android-app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=0
          for variable in KEYSTORE_B64 STORE_PW KEY_PW KEY_ALIAS; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Required release-signing secret is missing: $variable"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$STORE_PW"
            printf 'keyPassword=%s\n' "$KEY_PW"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/key.properties

          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "$STORE_PW" \
            -alias "$KEY_ALIAS" > /dev/null

      - name: Build release APK
        working-directory: android-app
        run: flutter build apk --release

      - name: Verify release identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/feimiao-p0-fixes'
        working-directory: android-app
        env:
          VERSION_URL: https://updates.xunni9481.dpdns.org/version.json
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          bash ci/verify_release_apk.sh "$APK"

          PUBSPEC_VERSION=$(awk '/^version:[[:space:]]*/ { print $2; exit }' pubspec.yaml)
          VERSION_NAME=${PUBSPEC_VERSION%+*}
          VERSION_CODE=${PUBSPEC_VERSION##*+}
          SHA256=$(sha256sum < "$APK" | awk '{print $1}')
          RELEASE_ID="v${VERSION_CODE}-${SHA256:0:12}"

          VERSION_NAME="$VERSION_NAME" \
          VERSION_CODE="$VERSION_CODE" \
          SHA256="$SHA256" \
          RELEASE_ID="$RELEASE_ID" \
          node - <<'NODE' > build/release-candidate.json
          const candidate = {
            versionName: process.env.VERSION_NAME,
            versionCode: Number(process.env.VERSION_CODE),
            sha256: process.env.SHA256,
            releaseId: process.env.RELEASE_ID,
          };
          process.stdout.write(JSON.stringify(candidate, null, 2));
          NODE

          curl --fail --silent --show-error --location --max-time 30 \
            "$VERSION_URL" -o build/release-current.json

          DECISION=$(node ci/release_gate.mjs \
            --candidate build/release-candidate.json \
            --current build/release-current.json \
            --candidate-apk "$APK")
          printf 'release gate decision: %s\n' "$DECISION"

      - name: Collect release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/feimiao-p0-fixes'
        run: |
          SRC=android-app/build/app/outputs/flutter-apk/app-release.apk
          test -f "$SRC"
          cp "$SRC" "肥喵记账.apk"
          ls -lh "肥喵记账.apk"

      - name: Upload verified APK artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/feimiao-p0-fixes'
        uses: actions/upload-artifact@v4
        with:
          name: feimiao-apk
          path: 肥喵记账.apk
          if-no-files-found: error

  publish-github-release:
    name: Publish verified GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/feimiao-p0-fixes'
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: feimiao-apk
          path: release

      - name: Check downloaded artifact
        run: test -s "release/肥喵记账.apk"

      - name: Remove obsolete release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete-asset android-latest qingji.apk -y || true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 肥喵记账 安卓测试版（最新）
          prerelease: true
          overwrite_files: true
          files: release/肥喵记账.apk
          body: |
            肥喵记账安卓测试版。每次受保护分支更新后自动验证、构建并替换此安装包。
            手机浏览器直接下载“肥喵记账.apk”安装即可。
