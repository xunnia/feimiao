name: Android CI

on:
  push:
    branches: [claude/new-session-4kh1ll, main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 构建安卓 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 生成 android/ 脚手架（不覆盖 lib/ 与 pubspec）
        run: |
          # 在临时目录生成标准 Flutter 工程，只把 android/ 与 .metadata 拷回，
          # 保证我们手写的 lib/、pubspec.yaml 是唯一权威来源。
          flutter create --platforms=android --org com.qingji --project-name qingji /tmp/scaffold
          if [ ! -d android-app/android ]; then
            cp -r /tmp/scaffold/android android-app/android
          fi
          [ -f android-app/.metadata ] || cp /tmp/scaffold/.metadata android-app/.metadata

      - name: 拉取依赖
        working-directory: android-app
        run: flutter pub get

      - name: 静态分析
        working-directory: android-app
        run: flutter analyze || true

      - name: 跑单元测试
        working-directory: android-app
        run: flutter test || true

      - name: 构建 debug APK（可直接安装）
        working-directory: android-app
        run: flutter build apk --debug

      - name: 收集 APK
        run: |
          SRC=android-app/build/app/outputs/flutter-apk/app-debug.apk
          ls -lh "$SRC"
          cp "$SRC" qingji.apk

      - uses: actions/upload-artifact@v4
        with:
          name: qingji-apk
          path: qingji.apk

      # 传到固定 tag 的 GitHub Release，给用户一个稳定下载链接（不污染 git 历史）
      - name: 发布到 GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 轻记 安卓测试版（最新）
          prerelease: true
          files: qingji.apk
          body: |
            轻记安卓测试版，每次代码更新自动重新构建。
            手机浏览器直接下载 qingji.apk 安装即可（需在系统里允许「安装未知来源应用」）。
