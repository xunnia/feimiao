name: Android iOS parity screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/**"
      - "codex/**"
      - main
    paths:
      - "android-app/**"
      - "ios-app/**"
      - ".github/workflows/parity-screenshots.yml"

permissions:
  contents: write

concurrency:
  # Share the writer queue with iOS CI: both workflows push generated files
  # to the same branch and must never rebase/push concurrently. Queue rather
  # than cancel so one source push still produces both kinds of evidence.
  group: branch-artifact-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-screenshots:
    name: Android 模拟器截图
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify Android and iOS category icon assets
        run: python3 ios-app/tools/check_category_icon_parity.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Android dependencies
        working-directory: android-app
        run: flutter pub get
      - name: Setup Gradle 9.1 for GitHub runner
        id: setup-gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"
      - name: Route Flutter through cached Gradle
        working-directory: android-app/android
        run: |
          set -u
          route_log="$GITHUB_WORKSPACE/android-gradle-route.log"
          {
            echo "ANDROID_GRADLE_ROUTE_BEGIN"
            echo "PWD=$PWD"
            echo "JAVA_HOME=${JAVA_HOME:-}"
            echo "GRADLE_HOME=${GRADLE_HOME:-}"
            echo "RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE:-}"
            command -v java || true
            command -v gradle || true
            java -version

            gradle_bin="$(command -v gradle || true)"
            if [ -z "$gradle_bin" ] && [ -n "${GRADLE_HOME:-}" ]; then
              candidate="$GRADLE_HOME/bin/gradle"
              if [ -x "$candidate" ]; then gradle_bin="$candidate"; fi
            fi
            if [ -z "$gradle_bin" ]; then
              for search_root in "${RUNNER_TOOL_CACHE:-}" "$HOME/.gradle"; do
                if [ -z "$search_root" ] || [ ! -d "$search_root" ]; then continue; fi
                candidate="$(find "$search_root" -type f -path '*/bin/gradle' -perm -111 2>/dev/null | head -n 1)"
                if [ -n "$candidate" ]; then
                  gradle_bin="$candidate"
                  break
                fi
              done
            fi
            test -n "$gradle_bin"
            test -x "$gradle_bin"
            echo "GRADLE_BIN=$gradle_bin"
            "$gradle_bin" --version
            if [ -f gradlew ]; then
              echo "Existing gradlew found; preserving it for diagnostics"
              ls -l gradlew
              cp gradlew gradlew-wrapper-original
            else
              echo "No tracked gradlew found; creating a system-Gradle shim"
            fi
            printf '#!/usr/bin/env bash\nexec "%s" "$@"\n' "$gradle_bin" > gradlew
            chmod 755 gradlew
            ls -l gradlew gradlew-wrapper-original 2>/dev/null || ls -l gradlew
            ./gradlew --version
            echo "ANDROID_GRADLE_ROUTE_END status=0"
          } 2>&1 | tee "$route_log"
          status=${PIPESTATUS[0]}
          echo "ANDROID_GRADLE_ROUTE_EXIT status=$status" | tee -a "$route_log"
          exit "$status"
      - name: Publish Android Gradle route diagnostics
        if: always()
        run: |
          {
            echo "### Android Gradle route diagnostics"
            echo '```text'
            if [ -f android-gradle-route.log ]; then
              tail -n 200 android-gradle-route.log
            else
              echo "android-gradle-route.log was not created"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-gradle-route-log
          path: android-gradle-route.log
          if-no-files-found: warn
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture parity screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none
          emulator-boot-timeout: 1200
          # KVM 权限已在上一步开启；保留硬件加速，否则 1080x1920 的
          # Flutter 截图会退化为 --accel off，启动和渲染都可能长时间卡住。
          disable-linux-hw-accel: false
          disable-animations: false
          working-directory: android-app
          script: bash tooling/run_parity_capture.sh
      - name: Publish Android parity diagnostics
        if: always()
        run: |
          {
            echo "### Android parity drive diagnostics"
            echo '```text'
            if [ -f android-parity-drive.log ]; then
              tail -n 300 android-parity-drive.log
            else
              echo "android-parity-drive.log was not created"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Android parity screenshot surfaces
        if: success()
        run: |
          python3 ios-app/tools/check_android_parity_screenshots.py \
            android-app/outputs/parity/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-parity-drive-log
          path: android-parity-drive.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-parity-screenshots
          path: android-app/outputs/parity/
          if-no-files-found: error

  ios-screenshots:
    name: iOS 模拟器截图
    timeout-minutes: 45
    # 使用 GitHub 官方公开的 macOS 26 runner；如果镜像装有 Xcode 27
    # 就优先使用，否则用 Xcode 26.x 编译 iOS 26 目标（可运行于 iOS 27）。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate P0 same-product contract
        run: |
          python3 ios-app/tools/check_p0_product_contract.py
      - name: Validate screenshot route manifest
        run: |
          python3 ios-app/tools/check_route_manifest.py \
            --manifest ios-app/tools/screenshot_manifest.json \
            --workflow .github/workflows/parity-screenshots.yml
      - name: Select Xcode 27 (fallback to Xcode 26)
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          fi
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec ios-app/project.yml --project ios-app
      - name: Build for simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone Air \(" | head -n 1 | sed -E 's/^[[:space:]]*//; s/ \(.*$//')
          if [ -z "$DEVICE" ]; then
            DEVICE=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | sed -E 's/^[[:space:]]*//; s/ \(.*$//')
          fi
          test -n "$DEVICE"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          set +e
          xcodebuild build \
            -project ios-app/QingJi.xcodeproj \
            -scheme QingJi \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee xcodebuild-parity.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            grep -n -E 'error:|fatal error|BUILD FAILED' xcodebuild-parity.log | tail -200 || true
          fi
          test "$build_status" -eq 0
      - name: Capture screens
        run: |
          xcrun simctl bootstatus "$DEVICE" -b
          APP_PATH=$(find build/Build/Products -name "QingJi.app" -not -path "*PlugIns*" | head -n 1)
          test -d "$APP_PATH"
          xcrun simctl install "$DEVICE" "$APP_PATH"
          mkdir -p ci-artifacts/ios-screenshots
          runtime_log="ios-screenshot-runtime.log"
          : > "$runtime_log"
          shoot() {
            local screen="$1" name="$2"
            local output="ci-artifacts/ios-screenshots/$name.png"
            local attempt
            for attempt in 1 2 3; do
              echo "CAPTURE_BEGIN name=$name screen=$screen attempt=$attempt" | tee -a "$runtime_log"
              xcrun simctl terminate "$DEVICE" com.qingji.app >> "$runtime_log" 2>&1 || true
              sleep 1
              if ! SIMCTL_CHILD_QINGJI_DEMO=1 \
                SIMCTL_CHILD_QINGJI_DEMO_NOW="2026-08-27T12:00:00+08:00" \
                SIMCTL_CHILD_QINGJI_SCREEN="$screen" \
                xcrun simctl launch "$DEVICE" com.qingji.app >> "$runtime_log" 2>&1; then
                echo "::warning::CAPTURE_LAUNCH_FAILED name=$name screen=$screen attempt=$attempt"
                continue
              fi
              # Some SwiftData destinations perform their first query during
              # cold launch. Give the route time to render before capture.
              sleep 14
              if ! xcrun simctl io "$DEVICE" screenshot "$output" >> "$runtime_log" 2>&1 || ! test -s "$output"; then
                echo "::warning::CAPTURE_SCREENSHOT_FAILED name=$name screen=$screen attempt=$attempt"
                continue
              fi
              if python3 ios-app/tools/check_screenshot_nonempty.py "$output"; then
                echo "CAPTURE_DONE name=$name screen=$screen attempt=$attempt"
                return 0
              fi
              echo "::warning::CAPTURE_NONEMPTY_FAILED name=$name screen=$screen attempt=$attempt"
            done
            echo "::error::CAPTURE_FAILED_AFTER_RETRIES name=$name screen=$screen"
            xcrun simctl spawn "$DEVICE" log show --last 30s --style compact \
              --predicate 'process == "QingJi"' >> "$runtime_log" 2>&1 || true
            return 1
          }
          shoot home 01-home
          shoot quickadd 02-quickadd
          shoot quickadd/income 37-quickadd-income
          shoot transactions 03-transactions
          shoot stats/week 04-stats-week
          shoot stats/month 05-stats-month
          shoot stats/year 06-stats-year
          shoot stats/custom 07-stats-custom
          shoot settings/budget 08-budget
          shoot settings/reconcile 09-reconcile
          shoot settings/reimburse 10-reimburse
          shoot settings/reimburse/settlement 40-reimburse-settlement
          shoot settings/savings 11-savings
          shoot settings/recurring 12-recurring
          shoot settings/assets 13-assets
          shoot settings/assets/detail 38-assets-detail
          shoot settings/liabilities 14-liabilities
          shoot settings/net-worth 15-net-worth
          shoot settings/books 16-books
          shoot settings/accounts 17-accounts
          shoot settings/accounts/detail 39-account-detail
          shoot settings/categories 18-categories
          shoot settings/tags 19-tags
          shoot settings 20-settings
          shoot ai 21-ai
          shoot settings/ai 22-ai-settings
          shoot settings/import-review 23-import-review
          shoot settings/reports 24-reports
          shoot settings/memory 25-memory
          shoot settings/ai-tasks 26-ai-tasks
          shoot settings/ai-diagnostics 27-ai-diagnostics
          shoot settings/ai-search 28-ai-search
          shoot settings/ai-memory 29-ai-memory
          shoot settings/ai-extensions 30-ai-extensions
          shoot settings/ai-schedules 31-ai-schedules
          shoot settings/ai-local 32-ai-local
          shoot settings/backup 33-backup
          shoot settings/theme 34-theme
          shoot settings/display 35-display

          python3 ios-app/tools/write_parity_metadata.py \
            --root . \
            --contract ios-app/tools/p0_product_contract.json \
            --platform ios \
            --device "$DEVICE" \
            --os "iOS Simulator ($DEVICE)" \
            --screenshot-dir ci-artifacts/ios-screenshots \
            --output ci-artifacts/ios-screenshots/capture-metadata.json
          python3 ios-app/tools/check_capture_metadata.py \
            --root . \
            --metadata ci-artifacts/ios-screenshots/capture-metadata.json \
            --platform ios

          python3 ios-app/tools/check_screenshot_nonempty.py \
            ci-artifacts/ios-screenshots/*.png
          if ! python3 ios-app/tools/check_screenshot_distinct.py \
            ci-artifacts/ios-screenshots/*.png; then
            echo "::error::截图存在近重复，采集失败时附加导出 QingJi 系统日志"
            xcrun simctl spawn "$DEVICE" log show --last 5m --style compact \
              --predicate 'process == "QingJi"' >> "$runtime_log" 2>&1 || true
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-parity-screenshots
          path: ci-artifacts/ios-screenshots/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-parity-screenshot-diagnostics
          path: |
            xcodebuild-parity.log
            ios-screenshot-runtime.log
          if-no-files-found: warn

  compare:
    name: 生成双端对比报告
    needs: [android-screenshots, ios-screenshots]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install comparison tooling
        run: python3 -m pip install --disable-pip-version-check --user Pillow
      - uses: actions/download-artifact@v4
        with:
          name: android-parity-screenshots
          path: android-app/outputs/parity
      - uses: actions/download-artifact@v4
        with:
          name: ios-parity-screenshots
          path: ci-artifacts/ios-screenshots
      - name: Compare screenshots
        run: |
          python3 ios-app/tools/compare_png.py \
            --manifest ios-app/tools/screenshot_manifest.json \
            --root . \
            --output ci-artifacts/screenshot-report.json \
            --require-complete
      - name: Build visual Android/iOS comparison sheets
        run: |
          python3 ios-app/tools/make_ios_ui_comparisons.py \
            --root . \
            --manifest ios-app/tools/screenshot_manifest.json \
            --output-dir ci-artifacts/parity-comparisons
      - uses: actions/upload-artifact@v4
        with:
          name: parity-screenshot-report
          path: |
            ci-artifacts/screenshot-report.json
            ci-artifacts/screenshot-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: parity-visual-comparisons
          path: ci-artifacts/parity-comparisons/*.png
          if-no-files-found: error
      - name: Commit parity report back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ci-artifacts/screenshot-report.json ci-artifacts/screenshot-report.md
          git add -f ci-artifacts/parity-comparisons
          if git diff --cached --quiet; then
            echo "双端截图报告无变化，跳过提交"
            exit 0
          fi
          # Screenshot downloads overwrite the tracked iOS baseline in this
          # fresh CI checkout. Restore only those generated inputs before
          # rebasing the small report commit onto a concurrent iOS artifact
          # commit; the report remains staged.
          git restore -- ci-artifacts/ios-screenshots
          git commit -m "ci: 更新双端截图报告 [skip ci]"
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            echo "回写双端报告（第 ${attempt}/3 次）"
            if git fetch origin "${branch}" && \
              git rebase "origin/${branch}" && \
              git push origin HEAD:"${branch}"; then
              exit 0
            fi
            git rebase --abort || true
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "::error::双端截图报告回写在 3 次尝试后仍失败"
          exit 1
