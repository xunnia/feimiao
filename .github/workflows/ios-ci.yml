name: iOS CI

on:
  push:
    branches: ["claude/**", "codex/**", "feature/**", main]
    paths:
      - "ios-app/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    name: 核心逻辑单元测试
    # GitHub-hosted runner 的公开标签是 macos-26；Xcode 27 目前仍是
    # 镜像预览，不存在稳定的 xcode-27 runner 标签。脚本会优先选已安装
    # 的 Xcode 27，否则使用 macOS 26 镜像内的 Xcode 26.x/iOS 26 SDK。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: swift test (QingJiCore)
        run: swift test --package-path ios-app/QingJiCore

  build-app:
    name: 编译 iOS App
    # XcodeGen 生成的是 Xcode 16+ 工程格式（objectVersion 77）；Liquid Glass 需要 Xcode 26 SDK
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27 (fallback to Xcode 26)
        run: |
          ls -d /Applications/Xcode*.app
          XCODE_APP=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$XCODE_APP" ]; then
            echo "::error::runner 上没有 Xcode 27 或 Xcode 26，无法编译 Liquid Glass 工程"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios-app/project.yml --project ios-app
      - name: Build for iOS Simulator (no signing)
        run: |
          set +e
          xcodebuild build \
            -project ios-app/QingJi.xcodeproj \
            -scheme QingJi \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee xcodebuild-simulator.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            grep -n -E 'error:|fatal error|BUILD FAILED' xcodebuild-simulator.log | tail -200 || true
          fi
          exit "$build_status"
      - name: Package simulator app for Appetize
        run: |
          APP_PATH="build-simulator/Build/Products/Debug-iphonesimulator/QingJi.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Simulator app was not produced at $APP_PATH"
            find build-simulator/Build/Products -name "*.app" -print || true
            exit 1
          fi
          ditto -c -k --keepParent "$APP_PATH" QingJi-simulator.zip
          unzip -tq QingJi-simulator.zip
          file "$APP_PATH/QingJi"
          ls -lh QingJi-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QingJi-simulator-app
          path: QingJi-simulator.zip

  app-tests:
    name: App 层 XCTest
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27 (fallback to Xcode 26)
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          fi
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios-app/project.yml --project ios-app
      - name: Test app target on iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone Air \(" | head -n 1 | sed -E 's/^[[:space:]]*//; s/ \(.*$//')
          if [ -z "$DEVICE" ]; then
            DEVICE=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | sed -E 's/^[[:space:]]*//; s/ \(.*$//')
          fi
          test -n "$DEVICE"
          set +e
          xcodebuild test \
            -project ios-app/QingJi.xcodeproj \
            -scheme QingJi \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee xcodebuild-tests.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            grep -n -E 'error:|fatal error|BUILD FAILED' xcodebuild-tests.log | tail -200 || true
          fi
          test "$build_status" -eq 0

  simulator-screenshots:
    name: 模拟器截图
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27 (fallback to Xcode 26)
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$XCODE_APP" ]; then
            echo "::error::runner 上没有 Xcode 27 或 Xcode 26"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios-app/project.yml --project ios-app
      - name: Build for a concrete simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone Air \(" | head -n 1 | sed -E 's/^[[:space:]]*//; s/ \(.*$//')
          if [ -z "$DEVICE" ]; then
            DEVICE=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | sed -E 's/^[[:space:]]*//; s/ \(.*$//')
          fi
          if [ -z "$DEVICE" ]; then
            echo "::error::没有可用的 iPhone 模拟器"
            xcrun simctl list devices
            exit 1
          fi
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          echo "使用模拟器：$DEVICE"
          set +e
          xcodebuild build \
            -project ios-app/QingJi.xcodeproj \
            -scheme QingJi \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee xcodebuild-screenshots.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            grep -n -E 'error:|fatal error|BUILD FAILED' xcodebuild-screenshots.log | tail -200 || true
          fi
          exit "$build_status"
      - name: Launch app and capture screenshots
        run: |
          xcrun simctl bootstatus "$DEVICE" -b
          APP_PATH=$(find build/Build/Products -name "QingJi.app" -not -path "*PlugIns*" | head -n 1)
          echo "安装：$APP_PATH"
          xcrun simctl install "$DEVICE" "$APP_PATH"
          mkdir -p screenshots

          # 用「重启 + 启动参数」而不是 openurl 切页面：
          # simctl openurl 对自定义 scheme 会弹出系统「Open in App?」确认框，CI 无法点击，
          # 导致所有截图卡在同一个画面。改成每张图用 SIMCTL_CHILD_QINGJI_SCREEN 指定页面冷启动。
          # （SIMCTL_CHILD_ 前缀的环境变量会被 simctl 转发给 App。）
          shoot() {
            local screen="$1" name="$2"
            local output="screenshots/$name.png"
            local attempt
            for attempt in 1 2 3; do
              echo "CAPTURE_BEGIN name=$name screen=$screen attempt=$attempt"
              xcrun simctl terminate "$DEVICE" com.qingji.app 2>/dev/null || true
              sleep 1
              if ! SIMCTL_CHILD_QINGJI_DEMO=1 \
                SIMCTL_CHILD_QINGJI_DEMO_NOW="2026-08-27T12:00:00+08:00" \
                SIMCTL_CHILD_QINGJI_SCREEN="$screen" \
                xcrun simctl launch "$DEVICE" com.qingji.app; then
                echo "::warning::CAPTURE_LAUNCH_FAILED name=$name screen=$screen attempt=$attempt"
                continue
              fi
              # 年度图表、预算承诺物化和对账表单首次冷启动会触发较重的
              # SwiftData 查询；给它们足够时间完成首帧，避免把加载中的空根视图当截图。
              sleep 14
              if ! xcrun simctl io "$DEVICE" screenshot "$output" || ! test -s "$output"; then
                echo "::warning::CAPTURE_SCREENSHOT_FAILED name=$name screen=$screen attempt=$attempt"
                continue
              fi
              if python3 ios-app/tools/check_screenshot_nonempty.py "$output"; then
                echo "CAPTURE_DONE name=$name screen=$screen attempt=$attempt"
                return 0
              fi
              echo "::warning::CAPTURE_NONEMPTY_FAILED name=$name screen=$screen attempt=$attempt"
            done
            echo "::error::CAPTURE_FAILED_AFTER_RETRIES name=$name screen=$screen"
            xcrun simctl spawn "$DEVICE" log show --last 30s --style compact \
              --predicate 'process == "QingJi"' || true
            return 1
          }

          shoot "home"         "01-home"
          shoot "quickadd"     "02-quickadd"
          shoot "quickadd/income" "37-quickadd-income"
          shoot "transactions" "03-transactions"
          shoot "stats-week"   "04-stats-week"
          shoot "stats-month"  "05-stats-month"
          shoot "stats-year"   "06-stats-year"
          shoot "stats-custom" "07-stats-custom"
          shoot "budget"       "08-budget"
          shoot "reconcile"    "09-reconcile"
          shoot "reimburse"    "10-reimburse"
          shoot "settings/reimburse/settlement" "40-reimburse-settlement"
          shoot "savings"      "11-savings"
          shoot "recurring"    "12-recurring"
          shoot "assets"       "13-assets"
          shoot "settings/assets/detail" "38-assets-detail"
          shoot "liabilities"  "14-liabilities"
          shoot "net-worth"    "15-net-worth"
          shoot "books"        "16-books"
          shoot "settings/accounts" "17-accounts"
          shoot "settings/accounts/detail" "39-account-detail"
          shoot "settings/categories" "18-categories"
          shoot "settings/tags"  "19-tags"
          shoot "settings"     "20-settings"
          shoot "ai"           "21-ai"
          shoot "settings/ai"  "22-ai-settings"
          shoot "settings/import-review" "23-import-review"
          shoot "settings/reports" "24-reports"
          shoot "settings/memory" "25-memory"
          shoot "settings/ai-tasks" "26-ai-tasks"
          shoot "settings/ai-diagnostics" "27-ai-diagnostics"
          shoot "settings/ai-search" "28-ai-search"
          shoot "settings/ai-memory" "29-ai-memory"
          shoot "settings/ai-extensions" "30-ai-extensions"
          shoot "settings/ai-schedules" "31-ai-schedules"
          shoot "settings/ai-local" "32-ai-local"
          shoot "settings/backup" "33-backup"
          shoot "settings/theme" "34-theme"
          shoot "settings/display" "35-display"

          python3 ios-app/tools/check_screenshot_nonempty.py screenshots/*.png

          # 校验：35 张图若全部相同说明导航又失败了，直接让 CI 报错
          UNIQUE=$(md5 -q screenshots/*.png | sort -u | wc -l | tr -d ' ')
          echo "不同截图数量：$UNIQUE / 39"
          if [ "$UNIQUE" -le 1 ]; then
            echo "::error::截图全部相同，深链/启动参数导航未生效"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshot-diagnostics
          path: xcodebuild-screenshots.log
          if-no-files-found: warn

  unsigned-ipa:
    name: 打包未签名 IPA（AltStore 侧载用）
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27 (fallback to Xcode 26)
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$XCODE_APP" ]; then
            echo "::error::runner 上没有 Xcode 27 或 Xcode 26"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios-app/project.yml --project ios-app
      - name: Build Release for device (unsigned)
        # iOS 设备 SDK 不允许 ad-hoc 签名，这里完全不签名，交给 Sideloadly/AltStore 重签
        run: |
          set +e
          xcodebuild build \
            -project ios-app/QingJi.xcodeproj \
            -scheme QingJi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee xcodebuild-release.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            grep -n -E 'error:|fatal error|BUILD FAILED' xcodebuild-release.log | tail -200 || true
          fi
          exit "$build_status"
      - name: Build no-extension fallback (unsigned)
        # 免费 Personal Team 可能无法签 App Groups/扩展；这个版本只保留主 App，
        # 并用空 entitlement 构建，交给用户侧载工具重签。
        run: |
          free_entitlements="$PWD/ios-app/QingJi/QingJi-free.entitlements"
          set +e
          xcodebuild build \
            -project ios-app/QingJi.xcodeproj \
            -scheme QingJi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-noext \
            CODE_SIGN_ENTITLEMENTS="$free_entitlements" \
            CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee xcodebuild-noext.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            grep -n -E 'error:|fatal error|BUILD FAILED' xcodebuild-noext.log | tail -200 || true
          fi
          exit "$build_status"
      - name: Package IPA (完整版 + 免费团队无扩展兜底版)
        run: |
          # 完整版（含桌面小组件）
          rm -rf Payload Payload-noext
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/QingJi.app Payload/QingJi.app
          zip -qry QingJi-unsigned.ipa Payload
          # 无扩展版：使用空 entitlements 的第二次构建，再剥掉 PlugIns。
          mkdir -p Payload-noext/Payload
          cp -R build-noext/Build/Products/Release-iphoneos/QingJi.app Payload-noext/Payload/QingJi.app
          rm -rf Payload-noext/Payload/QingJi.app/PlugIns
          (cd Payload-noext && zip -qry ../QingJi-noext.ipa Payload)
          ls -lh QingJi-unsigned.ipa QingJi-noext.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: QingJi-unsigned-ipa
          path: |
            QingJi-unsigned.ipa
            QingJi-noext.ipa

  paired-screenshot-report:
    name: 双端截图对比报告
    needs: [simulator-screenshots]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: simulator-screenshots
          path: ci-artifacts/ios-screenshots
      - name: Generate screenshot parity report
        run: |
          python3 ios-app/tools/compare_png.py \
            --manifest ios-app/tools/screenshot_manifest.json \
            --root . \
            --output ci-artifacts/screenshot-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-parity-report
          path: |
            ci-artifacts/screenshot-report.json
            ci-artifacts/screenshot-report.md

  collect-ios-artifacts:
    name: 汇总 iOS 截图和 IPA
    if: github.event_name == 'push'
    needs: [simulator-screenshots, unsigned-ipa, paired-screenshot-report]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: simulator-screenshots
          path: ci-artifacts/ios-screenshots
      - uses: actions/download-artifact@v4
        with:
          name: QingJi-unsigned-ipa
          path: ci-artifacts/releases
      - uses: actions/download-artifact@v4
        with:
          name: screenshot-parity-report
          path: ci-artifacts
      - name: Commit artifacts back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-artifacts/ios-screenshots
          git add ci-artifacts/screenshot-report.json ci-artifacts/screenshot-report.md
          git add -f ci-artifacts/releases/QingJi-unsigned.ipa ci-artifacts/releases/QingJi-noext.ipa
          if git diff --cached --quiet; then
            echo "iOS 产物无变化，跳过提交"
            exit 0
          fi
          git commit -m "ci: 更新 iOS 截图与 IPA [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
