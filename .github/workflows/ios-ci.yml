name: iOS CI

on:
  push:
    branches: [claude/new-session-4kh1ll, main]
    paths:
      - "ios-app/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    name: 核心逻辑单元测试
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: swift test (QingJiCore)
        run: swift test --package-path ios-app/QingJiCore

  build-app:
    name: 编译 iOS App
    # XcodeGen 生成的是 Xcode 16+ 工程格式（objectVersion 77）；Liquid Glass 需要 Xcode 26 SDK
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_26" ]; then
            echo "::error::runner 上没有 Xcode 26，无法编译 iOS 26 / Liquid Glass 工程"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_26"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios-app/project.yml --project ios-app
      - name: Build for iOS Simulator (no signing)
        run: |
          xcodebuild build \
            -project ios-app/QingJi.xcodeproj \
            -scheme QingJi \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tail -100
          exit ${PIPESTATUS[0]}

  simulator-screenshots:
    name: 模拟器截图
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: |
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_26" ]; then
            echo "::error::runner 上没有 Xcode 26"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_26"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios-app/project.yml --project ios-app
      - name: Build for a concrete simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | sed -E 's/^[[:space:]]*//; s/ \(.*$//')
          if [ -z "$DEVICE" ]; then
            echo "::error::没有可用的 iPhone 模拟器"
            xcrun simctl list devices
            exit 1
          fi
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          echo "使用模拟器：$DEVICE"
          xcodebuild build \
            -project ios-app/QingJi.xcodeproj \
            -scheme QingJi \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tail -30
          exit ${PIPESTATUS[0]}
      - name: Launch app and capture screenshots
        run: |
          xcrun simctl bootstatus "$DEVICE" -b
          APP_PATH=$(find build/Build/Products -name "QingJi.app" -not -path "*PlugIns*" | head -n 1)
          echo "安装：$APP_PATH"
          xcrun simctl install "$DEVICE" "$APP_PATH"

          # 关键：SIMCTL_CHILD_ 前缀的环境变量会被 simctl 转发给被启动的 App，
          # App 内 ProcessInfo.environment["QINGJI_DEMO"] 读到 "1"，启用内存容器 + 演示数据。
          SIMCTL_CHILD_QINGJI_DEMO=1 xcrun simctl launch "$DEVICE" com.qingji.app
          # 等待 App 完成启动 + 演示数据写入
          sleep 15

          mkdir -p screenshots

          # 01 记一笔（默认首页）
          xcrun simctl openurl "$DEVICE" "qingji://add"
          sleep 3
          xcrun simctl io "$DEVICE" screenshot screenshots/01-quickadd.png

          # 02 明细列表
          xcrun simctl openurl "$DEVICE" "qingji://transactions"
          sleep 3
          xcrun simctl io "$DEVICE" screenshot screenshots/02-transactions.png

          # 03 统计 · 月度
          xcrun simctl openurl "$DEVICE" "qingji://stats"
          sleep 3
          xcrun simctl io "$DEVICE" screenshot screenshots/03-stats-month.png

          # 04 统计 · 年度
          xcrun simctl openurl "$DEVICE" "qingji://stats/year"
          sleep 3
          xcrun simctl io "$DEVICE" screenshot screenshots/04-stats-year.png

          # 05 设置 · 月度预算
          xcrun simctl openurl "$DEVICE" "qingji://settings/budget"
          sleep 3
          xcrun simctl io "$DEVICE" screenshot screenshots/05-budget.png

          # 06 设置 · 对账
          xcrun simctl openurl "$DEVICE" "qingji://settings/reconcile"
          sleep 3
          xcrun simctl io "$DEVICE" screenshot screenshots/06-reconcile.png

          # 07 设置主页
          xcrun simctl openurl "$DEVICE" "qingji://settings"
          sleep 3
          xcrun simctl io "$DEVICE" screenshot screenshots/07-settings.png

          # 08 AI 记一笔（弹出 sheet，延迟稍长等动画结束）
          xcrun simctl openurl "$DEVICE" "qingji://ai"
          sleep 4
          xcrun simctl io "$DEVICE" screenshot screenshots/08-ai.png
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots/
      # 把截图提交回分支，方便在受限网络环境（或手机上）直接查看
      - name: Commit screenshots back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ci-artifacts
          rm -rf ci-artifacts/screenshots
          cp -R screenshots ci-artifacts/screenshots
          git add ci-artifacts
          if git diff --cached --quiet; then
            echo "截图无变化，跳过提交"
            exit 0
          fi
          git commit -m "ci: 更新模拟器截图 [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

  unsigned-ipa:
    name: 打包未签名 IPA（AltStore 侧载用）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: |
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_26" ]; then
            echo "::error::runner 上没有 Xcode 26"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_26"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios-app/project.yml --project ios-app
      - name: Build Release for device (ad-hoc signed)
        # 用 ad-hoc 签名（CODE_SIGN_IDENTITY="-"）而非完全不签名：
        # 生成结构完整的 Mach-O 代码签名段，Sideloadly/AltStore 重签时更稳，
        # 可避免部分 "Guru Meditation / Invalid file" 报错。
        run: |
          xcodebuild build \
            -project ios-app/QingJi.xcodeproj \
            -scheme QingJi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            | tail -30
          exit ${PIPESTATUS[0]}
      - name: Package IPA (完整版 + 无小组件版)
        run: |
          # 完整版（含桌面小组件）
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/QingJi.app Payload/QingJi.app
          zip -qry QingJi-unsigned.ipa Payload
          # 无小组件版（剥掉 PlugIns，免费 Apple ID 侧载更易成功）
          rm -rf Payload/QingJi.app/PlugIns
          zip -qry QingJi-noext.ipa Payload
          ls -lh QingJi-unsigned.ipa QingJi-noext.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: QingJi-unsigned-ipa
          path: |
            QingJi-unsigned.ipa
            QingJi-noext.ipa
      # 把 IPA 提交回分支，提供固定下载链接（Sideloadly/AltStore 侧载用）
      - name: Commit IPA back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ci-artifacts
          cp QingJi-unsigned.ipa ci-artifacts/QingJi-unsigned.ipa
          cp QingJi-noext.ipa ci-artifacts/QingJi-noext.ipa
          git add ci-artifacts
          if git diff --cached --quiet; then
            echo "IPA 无变化，跳过提交"
            exit 0
          fi
          git commit -m "ci: 更新 IPA（完整版 + 无小组件版）[skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}" || {
            sleep 5
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          }
