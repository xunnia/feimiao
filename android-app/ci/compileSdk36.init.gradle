// CI installs this repository-owned init script into ~/.gradle/init.d.
//
// The application pins compileSdk 36 and declares the Chinese ML Kit model in
// android/app/build.gradle.kts. This compatibility shim is only for Flutter
// plugin subprojects that still declare an older compileSdk of their own.
allprojects {
    afterEvaluate { project ->
        if (project.name != "app" && project.hasProperty("android")) {
            project.android {
                compileSdkVersion 36
            }
        }
    }
}
