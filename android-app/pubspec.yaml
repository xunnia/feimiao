name: qingji
description: "肥喵记账 - 可爱又聪明的记账猫"
publish_to: 'none'
# 版本规则（用户 0703 拍板）：1.0 起步，每次推 GitHub 构建 minor +1（1.1、1.2…）。
# 加号后是 Android versionCode，必须只增不减，否则手机拒绝覆盖安装。
version: 1.268.0+282

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  archive: ^3.6.1
  crypto: ^3.0.7
  intl: ^0.20.2
  decimal: ^3.0.0
  sqflite: ^2.3.3
  path: ^1.9.0
  provider: ^6.1.2
  fl_chart: ^0.69.0
  http: ^1.2.0
  csv: ^6.0.0
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  # 10.3.10 uses flutter.compileSdkVersion; 8.x hard-codes android-34 and
  # fails the current Android 36 AAR metadata check.
  file_picker: ^10.3.10
  charset_converter: ^2.2.0
  excel: ^2.1.0
  image_picker: ^1.1.0
  photo_manager: ^3.12.0
  google_mlkit_text_recognition: ^0.13.0
  flutter_svg: ^2.0.10+1
  flutter_slidable: ^3.1.1
  image: ^4.3.0
  # 0.10.9 pulls workmanager_android 0.10.8, which fixes the AGP 9 /
  # android.builtInKotlin=false plugin-compilation path (upstream #722).
  workmanager: ^0.10.9
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.0.1
  # flutter_local_notifications 的 zonedSchedule 需要它；本来就是它的
  # 传递依赖（pubspec.lock 已锁 0.11.1），这里显式声明避免隐式依赖。
  timezone: ^0.11.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  # repo 层测试用：桌面/CI 上跑真 SQLite，验证迁移/合并/删账本这些最不能错的操作。
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  shaders:
    - shaders/ink_sparkle.frag
  assets:
    - assets/mascot/
    - assets/cat_icons/
    - assets/cat_icons_filled/
    - assets/cat_icons_line/
    - assets/book_covers/
    - assets/brand/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700

# 桌面图标：账单 + ¥ + 图表（蓝色玻璃风）。
# 小米等桌面会优先使用 Android 8+ adaptive icon XML，并放大前景层。
# 为避免图标被二次放大裁切，manifest 明确指向 @mipmap/ic_launcher_legacy
# 纯 PNG 资源；下面配置只保留源图路径，实际交付前用脚本同步各密度 PNG。
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
