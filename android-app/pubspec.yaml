name: qingji
description: "肥喵记账 - 可爱又聪明的记账猫"
publish_to: 'none'
# 版本规则（用户 0703 拍板）：1.0 起步，每次推 GitHub 构建 minor +1（1.1、1.2…）。
# 加号后是 Android versionCode，必须只增不减，否则手机拒绝覆盖安装。
version: 1.17.0+19

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  decimal: ^3.0.0
  sqflite: ^2.3.3
  path: ^1.9.0
  provider: ^6.1.2
  fl_chart: ^0.69.0
  http: ^1.2.0
  csv: ^6.0.0
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  file_picker: ^8.0.0
  charset_converter: ^2.2.0
  excel: ^2.1.0
  image_picker: ^1.1.0
  google_mlkit_text_recognition: ^0.13.0
  flutter_svg: ^2.0.10+1
  flutter_slidable: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  # repo 层测试用：桌面/CI 上跑真 SQLite，验证迁移/合并/删账本这些最不能错的操作。
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
    - assets/cat_icons/
    - assets/book_covers/
    - assets/brand/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700

# 桌面图标：账单 + ¥ + 图表（深蓝玻璃风），CI 里用 flutter_launcher_icons 生成各分辨率。
# 说明：这张图是「完整成品图标」(自带圆角+留白)，所以不走自适应前景层
# (前景层会被系统放大并裁掉边缘安全区，导致图标显示不全/被放大)。
# 只生成传统图标，整张图直接展示，由桌面统一做圆角遮罩。
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
