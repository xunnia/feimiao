// Local copy of ci/compileSdk36.init.gradle for manual Gradle environments.
// The app itself pins compileSdk 36 and declares Chinese ML Kit in
// android/app/build.gradle.kts; this only raises Flutter plugin subprojects.
allprojects {
    afterEvaluate { project ->
        if (project.name != "app" && project.hasProperty("android")) {
            project.android {
                compileSdkVersion 36
            }
        }
    }
}
